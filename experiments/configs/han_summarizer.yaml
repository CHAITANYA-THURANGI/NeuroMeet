# Experiment: Hierarchical Attention Network (HAN) Summarizer
name: han_summarizer
description: "Two-level word and utterance GRU encoder with Bahdanau attention"
model:
  type: hierarchical
  vocab_size: 4000
  emb_dim: 128
  word_hid_dim: 128
  utt_hid_dim: 192
  dec_hid_dim: 192
  copy_gate: false
  attention: bahdanau

train:
  batch_size: 16
  lr: 0.001
  epochs: 30
  optimizer: adamw
